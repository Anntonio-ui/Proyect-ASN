name: Verificacion del proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar codigo
        run: npm run lint

      - name: Compilar
        run: npm run build

  backend:
    name: Backend - importacion y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar importacion de API
        run: python -c "import function_app"

      - name: Ejecutar pruebas
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "Las pruebas se incorporaran al integrar el PR de la API."
          fi
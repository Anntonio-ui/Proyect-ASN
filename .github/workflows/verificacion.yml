name: Verificacion del proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint, pruebas y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar codigo
        run: npm run lint

      - name: Ejecutar pruebas frontend
        run: npm test

      - name: Compilar
        run: npm run build

  backend:
    name: Backend - importacion y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar importacion de API
        run: python -c "import function_app"

      - name: Ejecutar pruebas
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "Las pruebas se incorporaran al integrar el PR de la API."
          fi

  container:
    name: Contenedor - build y arranque
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t asn-frontend:ci frontend
      - name: Comprobar puerto dinamico, SPA y archivos
        shell: bash
        run: |
          docker run -d --name asn-ci -e PORT=9090 -p 9090:9090 asn-frontend:ci
          trap 'docker logs asn-ci; docker rm -f asn-ci' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:9090/healthz
          curl --fail http://localhost:9090/ | grep -q 'Gestión de estudiantes'
          curl --fail http://localhost:9090/estudiantes | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/assets/no-existe.js)" = "404"
